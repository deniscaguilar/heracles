name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (verify + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unitários, integração (Testcontainers), ArchUnit, Modulith e portão JaCoCo >= 85% (domain e application).
      - name: ./mvnw verify
        working-directory: backend
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: backend/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error

  dependency-scan:
    name: scan de dependências (OSV-Scanner)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-cyclonedx
          path: sbom
      - name: Reprova com vulnerabilidade Alta ou Crítica
        run: .github/scripts/osv-gate.sh sbom/application.cdx.json

  image-scan:
    name: scan da imagem (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Constrói a imagem do backend
        run: docker build -t heracles-backend:ci backend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: heracles-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml

  npm-audit:
    name: npm audit (pacotes TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Roda em cada diretório com package-lock.json (web/, mobile/, packages/*). Sem nenhum, passa vazio.
      - name: npm audit
        run: .github/scripts/npm-audit.sh

  api-client:
    name: api-client (gerado, compila e testa)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: packages/api-client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/api-client/package-lock.json
      - run: npm ci
      # Regenera o cliente a partir do contrato e falha se o arquivo versionado estiver desatualizado (CA11).
      - name: Regenera o cliente a partir de backend/openapi/openapi.json
        run: npm run generate
      - name: O cliente versionado está em dia
        run: git diff --exit-code -- src/schema.d.ts
      - run: npm run build
      - run: npm test

  web:
    name: web (build e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            packages/api-client/package-lock.json
      # O web usa o cliente gerado como dependência local (`file:`); ele precisa estar compilado.
      - name: Compila o cliente de API
        working-directory: packages/api-client
        run: npm ci && npm run build
      - run: npm ci
      # Falha só com vulnerabilidade Alta ou Crítica (CLAUDE.md, seção 7).
      - run: npm audit --audit-level=high
      - run: npm run build
      - run: npm test

  e2e:
    name: e2e (web contra a pilha local)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            packages/api-client/package-lock.json
      - name: Compila o cliente de API
        working-directory: packages/api-client
        run: npm ci && npm run build
      - name: Instala o web e o Chromium
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium
      # Backend, banco e servidor OIDC de mentira reais, os mesmos do ambiente local.
      - name: Sobe a pilha local
        run: docker compose -f docker/compose.yml up -d --build --wait --wait-timeout 600
      - name: Fluxo crítico (login, perfil, /admin)
        working-directory: web
        run: npm run test:e2e
      - name: Logs da pilha (se falhou)
        if: failure()
        run: docker compose -f docker/compose.yml logs --no-color --tail 200

  mobile:
    name: mobile (tipos e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            packages/api-client/package-lock.json
      # O mobile usa o cliente gerado como dependência local (`file:`); ele precisa estar compilado.
      - name: Compila o cliente de API
        working-directory: packages/api-client
        run: npm ci && npm run build
      - run: npm ci
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile
      - run: npm test
        working-directory: mobile

  infra:
    name: infra (OpenTofu validate, plan e scan)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Formatação
        run: tofu fmt -check -recursive infra
      - name: Validação (sem estado remoto e sem credenciais)
        working-directory: infra/stack
        run: |
          tofu init -backend=false -input=false
          tofu validate
      # CA18: o plan, offline, só traz os recursos de RF10 (rede sem NAT, EC2 ARM, RDS, S3, SQS, SSM) e as regras de segurança.
      - name: Plan offline contra as regras de RF10 (smoke e prod)
        run: |
          infra/scripts/check-plan.sh smoke
          infra/scripts/check-plan.sh prod
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: infra
          severity: HIGH,CRITICAL
          exit-code: '1'
          skip-dirs: '**/.terraform'
          trivyignores: .trivyignore.yaml
