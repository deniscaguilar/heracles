name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (verify + cobertura)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      # Unitários, integração (Testcontainers), ArchUnit, Modulith e portão JaCoCo >= 85% (domain e application).
      - name: ./mvnw verify
        working-directory: backend
        run: ./mvnw -B verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: backend/target/classes/META-INF/sbom/application.cdx.json
          if-no-files-found: error

  dependency-scan:
    name: scan de dependências (OSV-Scanner)
    needs: backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-cyclonedx
          path: sbom
      - name: Reprova com vulnerabilidade Alta ou Crítica
        run: .github/scripts/osv-gate.sh sbom/application.cdx.json

  image-scan:
    name: scan da imagem (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Constrói a imagem do backend
        run: docker build -t heracles-backend:ci backend
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: heracles-backend:ci
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: false
          trivyignores: .trivyignore.yaml

  npm-audit:
    name: npm audit (pacotes TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Roda em cada diretório com package-lock.json (web/, mobile/, packages/*). Sem nenhum, passa vazio.
      - name: npm audit
        run: .github/scripts/npm-audit.sh
