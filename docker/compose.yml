# Ambiente local (CLAUDE.md, seção 8). Imagens fixadas por digest.
# Credenciais abaixo são só do ambiente local; nada daqui vai a produção.
# Nome distinto de "heracles" para não colidir com projetos antigos na mesma máquina.
# Portas do host fora do padrão (e sobrescrevíveis) para conviver com outros ambientes locais.
name: heracles-dev

services:
  postgres:
    image: postgres:18@sha256:979bccfde35445db618c65107d27d08c6c21339d8dc3ad4c830c6633947be0e4
    environment:
      POSTGRES_DB: heracles
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["${HERACLES_PG_PORT:-5433}:5432"]
    volumes: [postgres-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heracles"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    ports: ["${HERACLES_SQS_PORT:-9324}:9324", "${HERACLES_SQS_UI_PORT:-9325}:9325"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null \"http://127.0.0.1:9324/?Action=ListQueues\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  localstack:
    image: localstack/localstack:4.14.0@sha256:3ebc37595918b8accb852f8048fef2aff047d465167edd655528065b07bc364a
    environment:
      SERVICES: s3
    ports: ["${HERACLES_S3_PORT:-4567}:4566"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:4566/_localstack/health | grep -q '\"s3\": \"\\(available\\|running\\)\"'"]
      interval: 5s
      timeout: 5s
      retries: 30

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1@sha256:4f3660e5f3586b81fe2e0d42d0c9fcd3c8c64268db0d3ade261dadd70d27020b
    environment:
      SERVER_PORT: "8080"
    ports: ["${HERACLES_OIDC_PORT:-8082}:8080"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/default/.well-known/openid-configuration || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  otel:
    image: grafana/otel-lgtm:latest@sha256:4c8056c9c05fcb3c8fd93800e85334bfd79b4d0271b47a54a121a64af41fe1fe
    ports: ["${HERACLES_GRAFANA_PORT:-3001}:3000", "${HERACLES_OTLP_GRPC_PORT:-4327}:4317", "${HERACLES_OTLP_HTTP_PORT:-4328}:4318"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ../backend
    image: heracles-backend:local
    environment:
      SPRING_PROFILES_ACTIVE: all
      # Flyway runs as the database admin; the application connects as heracles_app (local-only credentials).
      HERACLES_DB_URL: jdbc:postgresql://postgres:5432/heracles
      HERACLES_DB_ADMIN_USER: postgres
      HERACLES_DB_ADMIN_PASSWORD: postgres
      HERACLES_DB_APP_PASSWORD: heracles_app_local
      HERACLES_DB_OWNER_PASSWORD: heracles_owner_local
      # Tokens are issued to clients on the host (localhost:8082); the backend fetches the keys inside the network.
      HERACLES_OIDC_ISSUER: http://localhost:8082/default
      HERACLES_OIDC_JWK_SET_URI: http://oidc:8080/default/jwks
      HERACLES_OIDC_AUDIENCE: heracles-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    ports: ["${HERACLES_API_PORT:-8080}:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      elasticmq: {condition: service_healthy}
      localstack: {condition: service_healthy}
      oidc: {condition: service_healthy}
      otel: {condition: service_healthy}
    healthcheck:
      # A imagem não traz curl nem wget; HTTP direto pelo bash.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /actuator/health/liveness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

volumes:
  postgres-data:
